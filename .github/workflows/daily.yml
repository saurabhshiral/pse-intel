name: PSE Intel Daily Fetch

on:
  schedule:
    - cron: "0 14 * * *"  # ~6 AM PST / 7 AM PDT (Pacific time)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch articles and generate leadership briefs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python daily_fetch.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_history.csv news_recent.json leadership_briefs.json
          git diff --staged --quiet || git commit -m "chore: daily news fetch $(date -u +%Y-%m-%d) [skip ci]"
          git push
