name: PSE Intel Weekly

on:
  schedule:
    - cron: "0 15 * * 1"  # Monday ~7 AM PST / 8 AM PDT (Pacific time)
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser

      - name: Run leadership monitor
        id: monitor
        run: python monitor.py
        continue-on-error: true  # Exit code 1 means changes detected — still continue

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leadership_snapshot.json leadership_history.json
          git diff --staged --quiet || git commit -m "chore: update leadership snapshot [skip ci]"
          git push

      - name: Send weekly digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python digest.py
        continue-on-error: true
